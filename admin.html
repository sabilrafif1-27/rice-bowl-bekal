<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

const database = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_FLOW = ["Baru", "Diproses", "Siap Diambil", "Selesai"];

let orders = [];
let products = [];
let currentFilter = "Semua";

/* ==========================
   INIT & REALTIME LISTENERS
========================== */

refreshAll();
subscribeToRealtime();

function subscribeToRealtime() {
    // Mendengarkan perubahan otomatis dari tabel orders (Insert, Update, Delete)
    database
        .channel('public:orders')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, (payload) => {
            console.log('Perubahan pesanan terdeteksi:', payload);
            loadOrders(); // Load ulang pesanan saat ada data baru/berubah
            
            if (payload.eventType === 'INSERT') {
                showToast("🔔 Pesanan baru telah masuk!");
            }
        })
        .subscribe();
}

async function refreshAll(){
    const btn = document.getElementById("refreshBtn");
    btn.disabled = true;
    btn.textContent = "⏳ Memuat...";

    await Promise.all([loadOrders(), loadProducts()]);

    btn.disabled = false;
    btn.textContent = "🔄 Refresh";
}

/* ==========================
   LOAD ORDERS
========================== */

async function loadOrders(){
    const container = document.getElementById("ordersList");

    const { data, error } = await database
        .from("orders")
        .select("*")
        .order("id", { ascending: false });

    if(error){
        console.error("Error fetching orders:", error);
        container.innerHTML = `<div class="empty">❌ Gagal mengambil pesanan: ${escapeHTML(error.message)}</div>`;
        return;
    }

    orders = data || [];
    renderStats();
    renderOrders();
}

function renderStats(){
    const total = orders.length;
    const baru = orders.filter(o => o.status === "Baru").length;
    const proses = orders.filter(o => o.status === "Diproses").length;
    const totalRp = orders.reduce((sum, o) => sum + Number(o.total || 0), 0);

    document.getElementById("statTotal").textContent = total;
    document.getElementById("statBaru").textContent = baru;
    document.getElementById("statProses").textContent = proses;
    document.getElementById("statTotalRp").textContent = "Rp" + totalRp.toLocaleString("id-ID");
}

function setFilter(status){
    currentFilter = status;

    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.filter === status);
    });

    renderOrders();
}

function renderOrders(){
    const container = document.getElementById("ordersList");

    const list = currentFilter === "Semua"
        ? orders
        : orders.filter(o => o.status === currentFilter);

    if(list.length === 0){
        container.innerHTML = `<div class="empty">Belum ada pesanan.</div>`;
        return;
    }

    container.innerHTML = list.map(order => {
        const statusClass = "status-" + (order.status || "Baru").replace(/\s+/g, "-");
        const badgeClass = (order.status || "Baru").replace(/\s+/g, "-");
        const currentIndex = STATUS_FLOW.indexOf(order.status);
        const nextStatus = currentIndex >= 0 && currentIndex < STATUS_FLOW.length - 1
            ? STATUS_FLOW[currentIndex + 1]
            : null;

        return `
            <div class="order-card ${statusClass}">
                <div class="order-info">
                    <div class="top">
                        <span class="order-id">#${order.id}</span>
                        <span class="badge ${badgeClass}">${escapeHTML(order.status || "Baru")}</span>
                    </div>
                    <div class="name">${escapeHTML(order.customer_name || "-")} — ${escapeHTML(order.customer_class || "-")}</div>
                    <div class="meta">${escapeHTML(order.product_name || "-")} × ${order.quantity || 1}</div>
                    ${order.note ? `<div class="note">📝 ${escapeHTML(order.note)}</div>` : ""}
                </div>

                <div class="order-total">Rp${Number(order.total || 0).toLocaleString("id-ID")}</div>

                <div class="order-actions">
                    ${nextStatus
                        ? `<button class="status-btn next" onclick="advanceStatus(${order.id})">➜ ${escapeHTML(nextStatus)}</button>`
                        : `<button class="status-btn done">✅ Selesai</button>`
                    }
                    <button class="status-btn delete" onclick="deleteOrder(${order.id})">🗑 Hapus</button>
                </div>
            </div>
        `;
    }).join("");
}

async function advanceStatus(orderId){
    const order = orders.find(o => o.id === orderId);
    if(!order) return;

    const currentIndex = STATUS_FLOW.indexOf(order.status);
    if(currentIndex < 0 || currentIndex >= STATUS_FLOW.length - 1) return;

    const nextStatus = STATUS_FLOW[currentIndex + 1];

    const { error } = await database
        .from("orders")
        .update({ status: nextStatus })
        .eq("id", orderId);

    if(error){
        showToast("Gagal mengubah status: " + error.message, true);
        return;
    }

    order.status = nextStatus;
    renderStats();
    renderOrders();
    showToast(`Pesanan #${orderId} → ${nextStatus}`);
}

async function deleteOrder(orderId){
    if(!confirm(`Hapus pesanan #${orderId}? Tindakan ini tidak bisa dibatalkan.`)) return;

    const { error } = await database
        .from("orders")
        .delete()
        .eq("id", orderId);

    if(error){
        showToast("Gagal menghapus pesanan: " + error.message, true);
        return;
    }

    orders = orders.filter(o => o.id !== orderId);
    renderStats();
    renderOrders();
    showToast(`Pesanan #${orderId} dihapus.`);
}

/* ==========================
   LOAD PRODUCTS
========================== */

async function loadProducts(){
    const container = document.getElementById("productsGrid");

    const { data, error } = await database
        .from("products")
        .select("*")
        .order("id");

    if(error){
        console.error("Error fetching products:", error);
        container.innerHTML = `<div class="empty">❌ Gagal mengambil produk.</div>`;
        return;
    }

    products = data || [];
    renderProducts();
}

function renderProducts(){
    const container = document.getElementById("productsGrid");

    if(products.length === 0){
        container.innerHTML = `<div class="empty">Belum ada menu.</div>`;
        return;
    }

    container.innerHTML = products.map(product => `
        <div class="product-card">
            <h3>${escapeHTML(product.name)}</h3>
            <span class="status-active ${product.active ? "on" : "off"}">
                ${product.active ? "🟢 Aktif di menu" : "⚪ Disembunyikan"}
            </span>

            <div class="field-row">
                <label>Harga</label>
                <input type="number" id="price-${product.id}" value="${Number(product.price)}">
            </div>

            <div class="field-row">
                <label>Stok</label>
                <div class="stock-controls">
                    <button onclick="bumpStock(${product.id}, -1)">−</button>
                    <input type="number" id="stock-${product.id}" value="${Number(product.stock)}">
                    <button onclick="bumpStock(${product.id}, 1)">+</button>
                </div>
            </div>

            <div class="card-actions">
                <button class="save-btn" onclick="saveProduct(${product.id})">💾 Simpan</button>
                <button class="toggle-btn" onclick="toggleActive(${product.id})">
                    ${product.active ? "Sembunyikan" : "Tampilkan"}
                </button>
            </div>
        </div>
    `).join("");
}

function bumpStock(productId, delta){
    const input = document.getElementById(`stock-${productId}`);
    const newVal = Math.max(0, Number(input.value || 0) + delta);
    input.value = newVal;
}

async function saveProduct(productId){
    const priceInput = document.getElementById(`price-${productId}`);
    const stockInput = document.getElementById(`stock-${productId}`);

    const newPrice = Number(priceInput.value);
    const newStock = Number(stockInput.value);

    if(isNaN(newPrice) || newPrice < 0 || isNaN(newStock) || newStock < 0){
        showToast("Harga atau stok tidak valid.", true);
        return;
    }

    const { error } = await database
        .from("products")
        .update({ price: newPrice, stock: newStock })
        .eq("id", productId);

    if(error){
        showToast("Gagal menyimpan: " + error.message, true);
        return;
    }

    const product = products.find(p => p.id === productId);
    if(product){
        product.price = newPrice;
        product.stock = newStock;
    }

    showToast("Produk berhasil disimpan.");
}

async function toggleActive(productId){
    const product = products.find(p => p.id === productId);
    if(!product) return;

    const newActive = !product.active;

    const { error } = await database
        .from("products")
        .update({ active: newActive })
        .eq("id", productId);

    if(error){
        showToast("Gagal mengubah status: " + error.message, true);
        return;
    }

    product.active = newActive;
    renderProducts();
    showToast(newActive ? "Menu ditampilkan kembali." : "Menu disembunyikan dari pembeli.");
}

/* ==========================
   ADD PRODUCT
========================== */

async function addProduct(){
    const name = document.getElementById("newName").value.trim();
    const description = document.getElementById("newDesc").value.trim();
    const price = Number(document.getElementById("newPrice").value);
    const stock = Number(document.getElementById("newStock").value);
    const image = document.getElementById("newImage").value.trim();

    if(!name){
        showToast("Nama menu harus diisi.", true);
        return;
    }

    if(isNaN(price) || price <= 0){
        showToast("Harga tidak valid.", true);
        return;
    }

    if(isNaN(stock) || stock < 0){
        showToast("Stok tidak valid.", true);
        return;
    }

    const { error } = await database
        .from("products")
        .insert({
            name,
            description,
            price,
            stock,
            image: image || null,
            active: true
        });

    if(error){
        showToast("Gagal menambah menu: " + error.message, true);
        return;
    }

    document.getElementById("newName").value = "";
    document.getElementById("newDesc").value = "";
    document.getElementById("newPrice").value = "";
    document.getElementById("newStock").value = "";
    document.getElementById("newImage").value = "";

    await loadProducts();
    showToast("Menu baru berhasil ditambahkan.");
}

/* ==========================
   HELPERS
========================== */

function escapeHTML(str){
    if (!str) return '';
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function showToast(message, isError = false){
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = "toast show" + (isError ? " error" : "");
    setTimeout(() => {
        toast.className = "toast";
    }, 3000);
}

</script>
